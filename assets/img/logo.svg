<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dehya Beauty Salon">
  <defs>
    <linearGradient id="dh-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A5A0"/>
      <stop offset="1" stop-color="#C07B72"/>
    </linearGradient>
    <linearGradient id="dh-rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D78A9B"/>
      <stop offset="1" stop-color="#C26A7E"/>
    </linearGradient>
  </defs>

  <!-- emblem rings -->
  <circle cx="32" cy="32" r="30.4" fill="none" stroke="url(#dh-gold)" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="26.4" fill="none" stroke="url(#dh-gold)" stroke-width=".6" opacity=".45"/>

  <!-- five-petal flower (beauty blossom) -->
  <g fill="url(#dh-rose)">
    <ellipse cx="32" cy="20.6" rx="4.7" ry="6.9"/>
    <ellipse cx="32" cy="20.6" rx="4.7" ry="6.9" transform="rotate(72 32 32)"/>
    <ellipse cx="32" cy="20.6" rx="4.7" ry="6.9" transform="rotate(144 32 32)"/>
    <ellipse cx="32" cy="20.6" rx="4.7" ry="6.9" transform="rotate(216 32 32)"/>
    <ellipse cx="32" cy="20.6" rx="4.7" ry="6.9" transform="rotate(288 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="4.2" fill="url(#dh-gold)"/>

  <!-- sparkles -->
  <path d="M50.6 13.8c1-2.8 2.8-4.6 5.4-5.4-2.6-.8-4.4-2.6-5.4-5.4-.8 2.8-2.6 4.6-5.4 5.4 2.8.8 4.6 2.6 5.4 5.4Z" fill="url(#dh-gold)" opacity=".9"/>
  <path d="M15.4 46.2c.6-1.7 1.7-2.9 3.2-3.4-1.5-.5-2.6-1.7-3.2-3.4-.5 1.7-1.7 2.9-3.2 3.4 1.5.5 2.6 1.7 3.2 3.4Z" fill="url(#dh-gold)" opacity=".7"/>
</svg>